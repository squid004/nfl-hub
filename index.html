<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Hub</title>
<link rel="stylesheet" href="style.css?v=2026-10-15a">

<!-- PWA: "Add to Home Screen" install support -- manifest.json + sw.js (registered at the
     bottom of this file). theme-color/background_color match --bg so the OS status bar and
     the standalone splash screen are dark instead of defaulting to white. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NFL Hub">
</head>
<body>
<header>
  <div>
    <h1>NFL Hub</h1>
    <span id="status" class="muted">Loading…</span>
  </div>
  <div class="chips">
    <span id="deadline-chips"></span>
    <label class="small muted" style="display:flex;align-items:center;gap:4px;">Week
      <select id="week-select" title="View a previous week's Moneyline Pick'em, ATS, Power Rankings, and Parlays. Historical Power Rankings is unaffected -- it already covers every season."></select>
    </label>
    <button data-act="refresh">Refresh now</button>
  </div>
</header>

<nav id="tabs" role="tablist" aria-label="Sections">
  <button data-tab="pickem" role="tab">Moneyline Pick'em</button>
  <button data-tab="ats" role="tab">Against the Spread</button>
  <button data-tab="power" role="tab">Power Rankings</button>
  <button data-tab="parlays" role="tab">Parlays</button>
  <button data-tab="historical" role="tab">Historical Power Rankings</button>
  <button data-tab="model-trends" role="tab">Model Trends</button>
  <button data-tab="methodology" role="tab">Methodology</button>
  <button data-tab="pipeline-health" role="tab">Pipeline Health</button>
</nav>

<main>
  <section id="pickem" data-tab="pickem"></section>
  <section id="upsets" data-tab="pickem"></section>
  <section id="history" data-tab="pickem"></section>
  <section id="edge" data-tab="pickem"></section>

  <section id="atspickem" data-tab="ats"></section>
  <section id="atsupsets" data-tab="ats"></section>
  <section id="atshistory" data-tab="ats"></section>

  <section id="parlays-trends" data-tab="parlays"></section>
  <section id="odds" data-tab="parlays"></section>

  <section id="power" data-tab="power"></section>

  <section id="historical" data-tab="historical"></section>

  <section id="model-trends" data-tab="model-trends"></section>

  <section id="methodology" data-tab="methodology"></section>

  <section id="pipeline-health" data-tab="pipeline-health"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/4.1.2/plotly.min.js"></script>
<!-- Cache-busting: GitHub Pages serves every local file with Cache-Control: max-age=600
     (confirmed via response headers, 2026-10-11) -- without a version query string, a
     browser that already has an old copy can keep using it for up to 10 minutes after a
     push, sometimes longer depending on its own revalidation heuristics. Bump this ONE
     version string (search/replace across this file) whenever any js/*.js or style.css
     actually changes, so every browser is forced to fetch the new version immediately
     instead of waiting out its own cache -- date-only collided the first time two separate
     same-day deploys both touched JS (2026-10-11 twice), hence the trailing letter; append
     another letter (c, d, ...) rather than reusing a date already spent today. -->
<script src="js/util.js?v=2026-10-15a"></script>
<script src="js/db.js?v=2026-10-15a"></script>
<script src="js/deadlines.js?v=2026-10-15a"></script>
<script src="js/history.js?v=2026-10-15a"></script>
<script src="js/edge.js?v=2026-10-15a"></script>
<script src="js/agreement.js?v=2026-10-15a"></script>
<script src="js/pickem.js?v=2026-10-15a"></script>
<script src="js/odds.js?v=2026-10-15a"></script>
<script src="js/power.js?v=2026-10-15a"></script>
<script src="js/parlays.js?v=2026-10-15a"></script>
<script src="js/historical.js?v=2026-10-15a"></script>
<script src="js/modeltrends.js?v=2026-10-15a"></script>
<script src="js/methodology.js?v=2026-10-15a"></script>
<script src="js/pipelinehealth.js?v=2026-10-15a"></script>
<script src="js/tabs.js?v=2026-10-15a"></script>
<script src="js/app.js?v=2026-10-15a"></script>
<script>
  // Registered relative to this page (not a hardcoded /nfl-hub/ path) so it resolves
  // correctly under GitHub Pages' project-page subpath without being coupled to the repo
  // name. sw.js living at the repo root gives it scope over the whole site by default.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
