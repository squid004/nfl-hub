<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>NFL Hub</h1>
    <span id="status" class="muted">Loading…</span>
  </div>
  <div class="chips">
    <span id="deadline-chips"></span>
    <button data-act="refresh">Refresh now</button>
  </div>
</header>

<nav id="tabs" role="tablist" aria-label="Sections">
  <button data-tab="pickem" role="tab">Moneyline Pick'em</button>
  <button data-tab="fantasy" role="tab">Start/Sit Fantasy</button>
  <button data-tab="survivor" role="tab">Survivor</button>
  <button data-tab="parlays" role="tab">Parlays</button>
</nav>

<main>
  <section id="pickem" data-tab="pickem"></section>
  <section id="upsets" data-tab="pickem"></section>
  <section id="history" data-tab="pickem"></section>

  <section id="fantasy" class="grid2" data-tab="fantasy"></section>
  <section id="news" data-tab="fantasy"></section>

  <section id="survivor" data-tab="survivor"></section>

  <section id="parlays-stub" data-tab="parlays">
    <div class="panel">
      <h2>Parlays</h2>
      <p class="muted">Parlay tracking is coming. For now this tab holds the full odds
        board below — spreads, totals, moneylines and de-vigged win probabilities for
        every game this week.</p>
    </div>
  </section>
  <section id="odds" data-tab="parlays"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/deadlines.js"></script>
<script src="js/history.js"></script>
<script src="js/fantasy.js"></script>
<script src="js/pickem.js"></script>
<script src="js/survivor.js"></script>
<script src="js/odds.js"></script>
<script src="js/news.js"></script>
<script src="js/tabs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
